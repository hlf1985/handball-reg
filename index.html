<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>手球比赛报名</title>
<style>
  html,body{height:100%;margin:0}
  body{display:flex;align-items:center;justify-content:center;background:#f5f6f8;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif}
  .box{text-align:center;color:#555;padding:24px}
  .spin{width:38px;height:38px;margin:0 auto 16px;border:4px solid #e3e6ec;border-top-color:#c8102e;border-radius:50%;animation:sp 1s linear infinite}
  @keyframes sp{to{transform:rotate(360deg)}}
  h1{font-size:17px;color:#c8102e;margin:0 0 8px;font-weight:700}
  p{font-size:14px;margin:0;line-height:1.7}
  a{color:#c8102e}
</style>
</head>
<body>
<div class="box">
  <div class="spin"></div>
  <h1 id="t">正在进入报名页…</h1>
  <p id="s">请稍候</p>
</div>
<script>
/* ===== 固定入口跳转页 =====
   这个页面的地址永久不变；它会把当前隧道地址转发出去。
   目标地址优先从同站点的 target.txt 实时读取（带时间戳参数，绕过 CDN 缓存），
   读不到时用下面 TUNNEL 这一行兜底（由脚本自动更新）。 */
var TUNNEL = "https://1088a496.r2.cpolar.cn";

function buildTarget(base, hash, search){
  base = String(base || "").replace(/\/+$/, "");
  if(!base) return "";
  if(hash) return base + "/" + hash;
  if(/(^|[?&])event=/.test(search)) return base + "/#/home" + search;
  return base + "/";
}

function jump(base){
  var target = buildTarget(base, location.hash || "", location.search || "");
  if(!target){
    document.getElementById("t").textContent = "入口未配置";
    document.getElementById("s").textContent = "请联系赛事管理员";
    return;
  }
  document.getElementById("s").textContent = "如 3 秒内没有自动跳转，点这里";
  var btn = document.createElement("p");
  btn.innerHTML = '<a href="' + target.replace(/"/g, "&quot;") + '">手动进入报名页</a>';
  document.querySelector(".box").appendChild(btn);
  setTimeout(function(){
    try { location.replace(target); } catch(e){ location.href = target; }
  }, 50);
}

(function(){
  var fallback = String(TUNNEL || "").trim();
  if(!window.fetch){ jump(fallback); return; }
  fetch("target.txt?t=" + Date.now(), {cache: "no-store"})
    .then(function(r){ if(!r.ok) throw 0; return r.text(); })
    .then(function(txt){
      var u = String(txt || "").trim().split(/\s+/)[0] || "";
      jump(/^https?:\/\/[a-z0-9][a-z0-9.-]*/i.test(u) ? u : fallback);
    })
    .catch(function(){ jump(fallback); });
})();
</script>
</body>
</html>
